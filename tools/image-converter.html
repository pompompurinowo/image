<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片与字体上传工具</title>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--text:#17202a;--muted:#667085;--line:#d7dde5;--primary:#2457d6;--primary-soft:#eaf0ff;--ok:#167647;--ok-soft:#eaf7f0;--warn:#a15c00;--danger:#b42318}*{box-sizing:border-box}body{margin:0;padding:24px;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);min-height:100vh;letter-spacing:0}.wrap{max-width:1080px;margin:auto}h1{margin:0 0 6px;font-size:30px}.sub{color:var(--muted);margin-bottom:20px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin:0 0 14px}.drop{border:2px dashed #aebbd0;border-radius:8px;padding:36px 18px;text-align:center;background:#fafbfc;cursor:pointer}.drop.drag{background:var(--primary-soft);border-color:var(--primary)}.drop b{display:block;font-size:18px;margin-bottom:7px}.drop span,label,.meta,.url,.tip,.token-note{color:var(--muted);font-size:13px}input[type=file]{display:none}.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end}label{display:block;margin-bottom:6px}select,input[type=number],input[type=password]{width:100%;min-height:40px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;color:var(--text)}.quality{display:flex;align-items:center;min-height:40px}.quality input{width:100%}.actions,.copy-actions,.token-actions{display:flex;gap:8px;flex-wrap:wrap}.actions,.copy-actions{margin-top:14px}button{border:1px solid transparent;border-radius:6px;min-height:38px;padding:8px 12px;cursor:pointer;font-weight:650;background:var(--primary-soft);color:#2445a5}button:hover:not(:disabled){filter:brightness(.97)}button.primary{background:var(--primary);color:#fff}.success{background:var(--ok-soft);color:var(--ok)}button:disabled{opacity:.45;cursor:not-allowed}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:12px}.thumb{width:58px;height:58px;object-fit:cover;border-radius:6px;background:#edf1f6}.font-result{grid-column:1 / -1;display:grid;gap:12px}.font-url-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.font-url{font-size:16px;color:var(--primary);word-break:break-all;text-decoration:underline;text-underline-offset:4px}.font-preview{min-height:150px;border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.65;overflow-wrap:anywhere;background:#fff}.font-preview.loading{color:var(--muted);font-family:inherit!important;font-size:14px!important}.font-size-control{display:flex;align-items:center;gap:10px}.font-size-control label{margin:0;white-space:nowrap}.font-size-control input{width:100%}.name{font-weight:700;overflow-wrap:anywhere}.meta{margin-top:4px}.links{display:grid;gap:5px;margin-top:9px}.link-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:center}.link-label{font-size:12px;font-weight:700;color:#475467}.url{word-break:break-all}.copy{font-size:12px;min-height:30px;padding:4px 8px}.status{font-size:12px;font-weight:700;max-width:210px;text-align:right;line-height:1.5}.ok{color:var(--ok)}.warn{color:var(--warn)}.error{color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:18px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.panel-title h2{font-size:18px;margin:0}.panel-title button{min-height:32px;padding:5px 9px}.tip{line-height:1.75}.tokenbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}.token-note{margin-top:7px;line-height:1.6}.notice{border-left:3px solid var(--warn);padding-left:12px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}.item{grid-template-columns:50px minmax(0,1fr)}.thumb{width:50px;height:50px}.status{grid-column:2;text-align:left;max-width:none}}@media(max-width:560px){body{padding:12px}.controls{grid-template-columns:1fr}.tokenbox{grid-template-columns:1fr}.link-row,.font-url-row{grid-template-columns:1fr auto}.link-label{grid-column:1 / -1}.item{grid-template-columns:44px minmax(0,1fr)}.thumb{width:44px;height:44px}.copy-actions button{flex:1 1 calc(50% - 8px)}.font-preview{min-height:120px;padding:16px}}
</style>
</head>
<body>
<main class="wrap">
<h1>图片与字体上传工具</h1>
<div class="sub">转换图片或保留字体原文件，上传 GitHub，并生成可直接使用的 URL</div>

<section class="panel">
  <div class="tokenbox">
    <div>
      <label for="token">GitHub Token（仅需本仓库 Contents 读写权限）</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_... 或 ghp_...">
    </div>
    <div class="token-actions">
      <button id="saveToken" class="success" type="button">保存 Token</button>
      <button id="removeToken" type="button">删除已保存</button>
      <button id="testToken" type="button">测试连接</button>
    </div>
  </div>
  <div id="tokenStatus" class="token-note">点击“保存 Token”后会保存在当前浏览器本地，只发送到 api.github.com。</div>
</section>

<section class="panel">
  <div class="drop" id="drop" role="button" tabindex="0" aria-controls="files">
    <b>把图片或字体拖到这里</b><span>支持图片以及 TTF、OTF、WOFF、WOFF2，可混合批量处理</span>
    <input id="files" type="file" accept="image/*,.ttf,.otf,.woff,.woff2" multiple>
  </div>
</section>

<section class="panel">
  <div class="controls">
    <div><label for="format">图片输出格式</label><select id="format"><option value="auto">自动兼容（透明 PNG / 其他 JPG）</option><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP（网页优先）</option></select></div>
    <div><label for="maxSide">最长边 px</label><input id="maxSide" type="number" value="2000" min="0" max="12000" step="100"></div>
    <div><label for="quality">画质 <b id="qText">88</b></label><div class="quality"><input id="quality" type="range" min="40" max="100" value="88"></div></div>
    <div><label for="rename">文件名</label><select id="rename"><option value="unique">唯一英文名（推荐）</option><option value="safe">原名安全化</option><option value="keep">保留原名</option></select></div>
    <div><label for="folder">图片上传目录</label><select id="folder"><option value="backgrounds">backgrounds · 背景</option><option value="avatars">avatars · 头像</option><option value="icons">icons · 图标</option><option value="illustrations">illustrations · 插画</option><option value="stickers">stickers · 贴纸</option><option value="front">front · 字体</option></select></div>
  </div>
  <div class="actions"><button id="convert" class="primary" type="button" disabled>开始转换</button><button id="upload" class="success" type="button" disabled>上传全部到 GitHub</button><button id="download" type="button" disabled>仅下载到本地</button><button id="clear" type="button">清空</button></div>
</section>

<section class="panel"><div id="list" class="list" aria-live="polite"><div class="empty">还没有文件</div></div></section>
<section class="panel">
  <div class="panel-title"><h2>上传历史</h2><button id="clearHistory" type="button">清空历史</button></div>
  <div id="history" class="list" aria-live="polite"><div class="empty">还没有上传记录</div></div>
</section>
<section class="panel tip notice"><b>目录说明：</b>图片使用上方选择的目录；字体会按格式自动上传到 front/ttf、front/otf、front/woff 或 front/woff2。GitHub-only 模式没有匿名上传 API，上传者必须提供自己的最小权限 Token。</section>
</main>
<script>
'use strict';
const OWNER='pompompurinowo',REPO='image',BRANCH='main',MAX_UPLOAD=20*1024*1024,TOKEN_STORAGE_KEY='github-image-uploader-token',HISTORY_STORAGE_KEY='github-image-uploader-history',MAX_HISTORY=100;
const FONT_TYPES={ttf:{folder:'front/ttf',format:'truetype'},otf:{folder:'front/otf',format:'opentype'},woff:{folder:'front/woff',format:'woff'},woff2:{folder:'front/woff2',format:'woff2'}};
const API=`https://api.github.com/repos/${OWNER}/${REPO}`;
const state=[],$=id=>document.getElementById(id),drop=$('drop'),files=$('files'),list=$('list'),historyList=$('history');
let history=[];
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

try{
  const savedToken=localStorage.getItem(TOKEN_STORAGE_KEY);
  if(savedToken){$('token').value=savedToken;$('tokenStatus').textContent='已从当前浏览器加载保存的 Token。';$('tokenStatus').className='token-note ok'}
}catch{$('tokenStatus').textContent='浏览器禁止本地存储，Token 无法自动保存。';$('tokenStatus').className='token-note warn'}
try{
  const savedHistory=JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY)||'[]');
  if(Array.isArray(savedHistory))history=savedHistory.filter(x=>x&&x.path&&x.links).slice(0,MAX_HISTORY);
}catch{history=[]}

$('quality').oninput=e=>$('qText').textContent=e.target.value;
drop.onclick=()=>files.click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();files.click()}};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};
drop.ondragleave=()=>drop.classList.remove('drag');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');add([...e.dataTransfer.files])};
files.onchange=e=>add([...e.target.files]);

function fileExtension(name){const match=name.toLowerCase().match(/\.([a-z0-9]+)$/);return match?match[1]:''}
function add(arr){
  arr.forEach(file=>{
    const fontExt=fileExtension(file.name),kind=FONT_TYPES[fontExt]?'font':file.type.startsWith('image/')?'image':'';
    if(!kind)return;
    state.push({file,kind,fontExt:kind==='font'?fontExt:'',preview:kind==='image'?URL.createObjectURL(file):'',blob:null,outName:'',path:'',links:null,status:kind==='font'?'待处理':'待转换',statusClass:'',uploaded:false,commit:''});
  });
  render();
}
function bytes(n){return n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(2)} MB`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function asciiSafe(s){return s.normalize('NFKD').replace(/[^\x00-\x7F]/g,'').replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/-+/g,'-').replace(/^[-_.]+|[-_.]+$/g,'').toLowerCase()||'image'}
function keptBase(name){const base=name.replace(/\.[^.]+$/,'').trim();if(!base||/[\\/]|\.\.|[\x00-\x1f\x7f]/.test(base))throw Error('文件名包含不安全字符');return base}
function uniqueBase(file,index){const stem=asciiSafe(file.name),stamp=new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14),random=crypto.getRandomValues(new Uint32Array(1))[0].toString(36).slice(0,5);return `${stamp}-${stem}-${index+1}-${random}`}
function extension(type){return type==='image/png'?'png':type==='image/jpeg'?'jpg':'webp'}
function encodePath(path){return path.split('/').map(encodeURIComponent).join('/')}
function publicLinks(path,commit=''){
  const encoded=encodePath(path),stable=commit?`https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${commit}/${encoded}`:'';
  return {main:`https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${BRANCH}/${encoded}`,stable,raw:`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encoded}`,pages:`https://${OWNER}.github.io/${REPO}/${encoded}`};
}
function fontCss(x){
  const family=(x.outName||'font').replace(/\.[^.]+$/,'').replace(/["\\]/g,'').trim()||'font',ext=x.fontExt||fileExtension(x.outName),format=FONT_TYPES[ext]?.format||ext;
  return `@font-face {\n  font-family: "${family}";\n  src: url("${x.links.main}") format("${format}");\n  font-weight: normal;\n  font-style: normal;\n  font-display: swap;\n}`;
}
function fontResult(x,scope,index){
  if(!x.links)return '';
  const prefix=scope==='history'?'history-':'',url=x.links.main;
  const source=x.localFontUrl||x.links.main;
  return `<div class="font-result"><div class="font-url-row"><a class="font-url" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a><button class="copy" data-${prefix}copy="main" data-i="${index}">复制 URL</button></div><div class="font-preview loading" data-font-preview="${scope}-${index}" data-font-source="${esc(source)}">字体加载中...</div><div class="font-size-control"><label for="font-size-${scope}-${index}">预览字号 <b data-font-size-text="${scope}-${index}">32</b> px</label><input id="font-size-${scope}-${index}" data-font-size="${scope}-${index}" type="range" min="16" max="72" value="32"></div></div>`;
}
function loadFontPreviews(root,items,scope){
  root.querySelectorAll('[data-font-preview]').forEach(async preview=>{
    const index=+preview.dataset.fontPreview.split('-').pop(),x=items[index],family=`uploaded-font-${scope}-${index}`;
    try{const face=new FontFace(family,`url("${preview.dataset.fontSource}")`);await face.load();document.fonts.add(face);const slider=root.querySelector(`[data-font-size="${scope}-${index}"]`);preview.style.fontFamily=`"${family}"`;preview.style.fontSize=`${slider?.value||32}px`;preview.textContent='这是一段示例文字，用于预览字体大小效果。';preview.classList.remove('loading')}catch{preview.textContent='字体链接正在刷新，暂时无法预览';preview.classList.add('loading')}
  });
  root.querySelectorAll('[data-font-size]').forEach(slider=>slider.oninput=()=>{const key=slider.dataset.fontSize,preview=root.querySelector(`[data-font-preview="${key}"]`),text=root.querySelector(`[data-font-size-text="${key}"]`);if(preview&&!preview.classList.contains('loading'))preview.style.fontSize=`${slider.value}px`;if(text)text.textContent=slider.value});
}
function markup(x,type){
  if((x.kind||'image')==='font'){
    if(type==='css')return fontCss(x);
    return [`主链接: ${x.links.main}`,x.links.stable&&`稳定链接: ${x.links.stable}`,`Raw 备用: ${x.links.raw}`,`Pages 备用: ${x.links.pages}`,'',fontCss(x)].filter(Boolean).join('\n');
  }
  const url=x.links.main,alt=x.outName.replace(/\.[^.]+$/,'');
  if(type==='markdown')return `![${alt}](${url})`;
  if(type==='html')return `<img src="${url}" alt="${alt}">`;
  if(type==='bbcode')return `[img]${url}[/img]`;
  return [`主链接: ${x.links.main}`,x.links.stable&&`稳定链接: ${x.links.stable}`,`Raw 备用: ${x.links.raw}`,`Pages 备用: ${x.links.pages}`].filter(Boolean).join('\n');
}
function copyButtons(x,attribute,index){
  if((x.kind||'image')==='font')return `<button class="copy" ${attribute}="css" data-i="${index}">复制 CSS</button>`;
  return `<button class="copy" ${attribute}="markdown" data-i="${index}">Markdown</button><button class="copy" ${attribute}="html" data-i="${index}">HTML</button><button class="copy" ${attribute}="bbcode" data-i="${index}">BBCode</button><button class="copy" ${attribute}="all" data-i="${index}">全部链接</button>`;
}
function persistHistory(){try{localStorage.setItem(HISTORY_STORAGE_KEY,JSON.stringify(history))}catch{}}
function addHistory(x){
  const record={outName:x.outName,path:x.path,links:x.links,commit:x.commit,kind:x.kind||'image',fontExt:x.fontExt||'',uploadedAt:new Date().toISOString()};
  history=[record,...history.filter(item=>item.path!==record.path)].slice(0,MAX_HISTORY);persistHistory();renderHistory();
}
function renderHistory(){
  if(!history.length){historyList.innerHTML='<div class="empty">还没有上传记录</div>';$('clearHistory').disabled=true;return}
  $('clearHistory').disabled=false;historyList.innerHTML='';
  history.forEach((x,i)=>{
    x.kind=x.kind||'image';x.fontExt=x.fontExt||(x.kind==='font'?fileExtension(x.outName):'');
    const el=document.createElement('article');el.className=`item${x.kind==='font'?' font-item':''}`;
    if(x.kind==='font')el.innerHTML=`${fontResult(x,'history',i)}<div class="copy-actions">${copyButtons(x,'data-history-copy',i)}</div><div class="meta">${esc(x.outName)} · ${esc(x.path)} · ${esc(new Date(x.uploadedAt).toLocaleString())}</div>`;
    else el.innerHTML=`<img class="thumb" src="${esc(x.links.raw||x.links.main)}" alt=""><div><div class="name">${esc(x.outName)}</div><div class="meta">${esc(x.path)} · ${esc(new Date(x.uploadedAt).toLocaleString())}</div><div class="links"><div class="link-row"><span class="link-label">主链接</span><span class="url">${esc(x.links.main)}</span><button class="copy" data-history-copy="main" data-i="${i}">复制</button></div>${x.links.stable?`<div class="link-row"><span class="link-label">稳定链接</span><span class="url">${esc(x.links.stable)}</span><button class="copy" data-history-copy="stable" data-i="${i}">复制</button></div>`:''}<div class="link-row"><span class="link-label">Raw 备用</span><span class="url">${esc(x.links.raw)}</span><button class="copy" data-history-copy="raw" data-i="${i}">复制</button></div><div class="link-row"><span class="link-label">Pages 备用</span><span class="url">${esc(x.links.pages)}</span><button class="copy" data-history-copy="pages" data-i="${i}">复制</button></div><div class="copy-actions">${copyButtons(x,'data-history-copy',i)}</div></div></div><div class="status ok">已上传</div>`;
    historyList.appendChild(el);
  });
  historyList.querySelectorAll('[data-history-copy]').forEach(button=>button.onclick=()=>{const x=history[+button.dataset.i],kind=button.dataset.historyCopy,text=['markdown','html','bbcode','css','all'].includes(kind)?markup(x,kind):x.links[kind];copyText(text,button)});
  loadFontPreviews(historyList,history,'history');
}
async function copyText(text,button){
  try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;area.className='visually-hidden';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}
  const old=button.textContent;button.textContent='已复制';setTimeout(()=>button.textContent=old,1000);
}
function render(){
  if(!state.length){list.innerHTML='<div class="empty">还没有文件</div>';$('convert').disabled=true;$('download').disabled=true;$('upload').disabled=true;return}
  $('convert').disabled=false;$('download').disabled=!state.some(x=>x.blob);$('upload').disabled=!state.some(x=>x.blob);
  list.innerHTML='';
  state.forEach((x,i)=>{
    const el=document.createElement('article');el.className=`item${x.kind==='font'?' font-item':''}`;
    if(x.kind==='font'){
      el.innerHTML=x.links?`${fontResult(x,'current',i)}<div class="copy-actions">${copyButtons(x,'data-copy',i)}</div><div class="meta">${esc(x.file.name)} · ${bytes(x.file.size)} · ${esc(x.path)}</div><div class="status ${x.statusClass}">${esc(x.status)}</div>`:`<div class="font-result"><div class="name">${esc(x.file.name)}</div><div class="meta">${bytes(x.file.size)} · 字体将上传到 ${esc(FONT_TYPES[x.fontExt].folder)}</div><div class="status ${x.statusClass}">${esc(x.status)}</div></div>`;
    }else{
      const links=x.links?`<div class="links"><div class="link-row"><span class="link-label">主链接</span><span class="url">${esc(x.links.main)}</span><button class="copy" data-copy="main" data-i="${i}">复制</button></div>${x.links.stable?`<div class="link-row"><span class="link-label">稳定链接</span><span class="url">${esc(x.links.stable)}</span><button class="copy" data-copy="stable" data-i="${i}">复制</button></div>`:''}<div class="link-row"><span class="link-label">Raw 备用</span><span class="url">${esc(x.links.raw)}</span><button class="copy" data-copy="raw" data-i="${i}">复制</button></div><div class="link-row"><span class="link-label">Pages 备用</span><span class="url">${esc(x.links.pages)}</span><button class="copy" data-copy="pages" data-i="${i}">复制</button></div><div class="copy-actions">${copyButtons(x,'data-copy',i)}</div></div>`:'';
      el.innerHTML=`<img class="thumb" src="${x.preview}" alt=""><div><div class="name">${esc(x.file.name)}</div><div class="meta">${bytes(x.file.size)}${x.blob?` → ${esc(x.outName)} · ${bytes(x.blob.size)}`:''}${x.path?` · ${esc(x.path)}`:''}</div>${links}</div><div class="status ${x.statusClass}">${esc(x.status)}</div>`;
    }
    list.appendChild(el);
  });
  list.querySelectorAll('[data-copy]').forEach(button=>button.onclick=()=>{const x=state[+button.dataset.i],kind=button.dataset.copy,text=['markdown','html','bbcode','css','all'].includes(kind)?markup(x,kind):x.links[kind];copyText(text,button)});
  loadFontPreviews(list,state,'current');
}
async function loadImage(file){const url=URL.createObjectURL(file),img=new Image();img.src=url;try{await img.decode();return img}finally{URL.revokeObjectURL(url)}}
function hasTransparency(ctx,w,h){const data=ctx.getImageData(0,0,w,h).data;for(let i=3;i<data.length;i+=4)if(data[i]<255)return true;return false}
async function convertOne(x,index){
  const q=+$('quality').value/100,max=Math.max(0,+$('maxSide').value||0),img=await loadImage(x.file);let w=img.naturalWidth,h=img.naturalHeight;
  if(!w||!h)throw Error('无法读取图片尺寸');
  if(max&&Math.max(w,h)>max){const scale=max/Math.max(w,h);w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale))}
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)throw Error('浏览器不支持 Canvas');
  ctx.drawImage(img,0,0,w,h);
  let type=$('format').value;
  if(type==='auto')type=hasTransparency(ctx,w,h)?'image/png':'image/jpeg';
  if(type==='image/jpeg'){ctx.globalCompositeOperation='destination-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='source-over'}
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(Error(`浏览器无法输出 ${type}`)),type,q));
  if(blob.size>MAX_UPLOAD)throw Error(`转换后超过 ${bytes(MAX_UPLOAD)}，请缩小尺寸或画质`);
  const mode=$('rename').value,old=x.file.name.replace(/\.[^.]+$/,''),base=mode==='unique'?uniqueBase(x.file,index):mode==='safe'?asciiSafe(old):keptBase(x.file.name);
  x.blob=blob;x.outName=`${base}.${extension(type)}`;x.path=`${$('folder').value}/${x.outName}`;x.links=publicLinks(x.path);x.status='已转换';x.statusClass='';x.uploaded=false;x.commit='';
}
async function prepareFont(x,index){
  if(x.file.size>MAX_UPLOAD)throw Error(`字体文件超过 ${bytes(MAX_UPLOAD)}`);
  const mode=$('rename').value,base=mode==='unique'?uniqueBase(x.file,index):mode==='safe'?asciiSafe(x.file.name):keptBase(x.file.name),config=FONT_TYPES[x.fontExt];
  x.blob=x.file;x.outName=`${base}.${x.fontExt}`;x.path=`${config.folder}/${x.outName}`;x.links=publicLinks(x.path);if(!x.localFontUrl)x.localFontUrl=URL.createObjectURL(x.file);x.status='字体已就绪';x.statusClass='';x.uploaded=false;x.commit='';
}
$('convert').onclick=async()=>{
  $('convert').disabled=true;const used=new Set();
  for(let i=0;i<state.length;i++){
    const x=state[i];x.status=x.kind==='font'?'处理中':'转换中';x.statusClass='';render();
    try{if(x.kind==='font')await prepareFont(x,i);else await convertOne(x,i);if(used.has(x.path))throw Error('批次内目标路径重复，请使用唯一英文名');used.add(x.path)}catch(error){x.blob=null;x.links=null;x.path='';x.status=`失败：${error.message}`;x.statusClass='error'}render();
  }
  $('convert').disabled=false;
};
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('download').onclick=async()=>{for(const x of state.filter(x=>x.blob)){save(x.blob,x.outName);await sleep(150)}};
$('clear').onclick=()=>{state.forEach(x=>{if(x.preview)URL.revokeObjectURL(x.preview);if(x.localFontUrl)URL.revokeObjectURL(x.localFontUrl)});state.length=0;files.value='';render()};
function headers(){const token=$('token').value.trim();if(!token)throw Error('请先填写 GitHub Token');return {'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}
function apiError(status,message=''){
  const known={401:'Token 无效或已过期',403:'权限不足、触发限流或被组织策略阻止',409:'仓库内容发生冲突',413:'文件或请求体过大',422:'文件路径、内容或分支无效'};
  return known[status]?`${known[status]} (${status})`:message||`GitHub API 请求失败 (${status})`;
}
async function request(url,options={}){let response;try{response=await fetch(url,options)}catch{throw Error('无法连接 GitHub API，请检查网络')};const data=await response.json().catch(()=>({}));if(!response.ok)throw Object.assign(Error(apiError(response.status,data.message)),{status:response.status});return data}
async function blobToBase64(blob){const buf=await blob.arrayBuffer(),bytes=new Uint8Array(buf);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary)}
async function getExistingSha(path){const response=await fetch(`${API}/contents/${encodePath(path)}?ref=${encodeURIComponent(BRANCH)}`,{headers:headers()}).catch(()=>{throw Error('无法连接 GitHub API，请检查网络')});if(response.status===404)return null;const data=await response.json().catch(()=>({}));if(!response.ok)throw Object.assign(Error(apiError(response.status,data.message)),{status:response.status});return data.sha||null}
async function putFile(x,sha){const body={message:`upload: ${x.path}`,content:await blobToBase64(x.blob),branch:BRANCH};if(sha)body.sha=sha;return request(`${API}/contents/${encodePath(x.path)}`,{method:'PUT',headers:headers(),body:JSON.stringify(body)})}
async function verifyLink(url){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
  try{const response=await fetch(`${url}${url.includes('?')?'&':'?'}verify=${Date.now()}`,{cache:'no-store',signal:controller.signal});return response.ok} catch{return false}finally{clearTimeout(timer)}
}
async function uploadOne(x){
  x.status='检查同名文件';x.statusClass='';render();let sha=await getExistingSha(x.path),data;
  for(let attempt=0;attempt<2;attempt++){x.status='上传中';render();try{data=await putFile(x,sha);break}catch(error){if(error.status!==409||attempt===1)throw error;sha=await getExistingSha(x.path)}}
  const actualPath=data.content?.path||x.path,commit=data.commit?.sha||'';x.path=actualPath;x.commit=commit;x.links=publicLinks(actualPath,commit);x.uploaded=true;x.status='已上传，正在验证直链';x.statusClass='ok';render();
  const mainReady=await verifyLink(x.links.main);if(mainReady){x.status='上传成功，主链接可用';x.statusClass='ok'}else{x.status='已上传；CDN 尚未刷新，请先用 Raw 备用';x.statusClass='warn'}
  addHistory(x);
}
$('upload').onclick=async()=>{try{headers()}catch(error){alert(error.message);return}$('upload').disabled=true;for(const x of state.filter(x=>x.blob)){try{await uploadOne(x)}catch(error){x.uploaded=false;x.status=`上传失败：${error.message}`;x.statusClass='error'}render()}$('upload').disabled=false};
$('saveToken').onclick=()=>{const status=$('tokenStatus'),token=$('token').value.trim();if(!token){status.textContent='请先填写 GitHub Token。';status.className='token-note error';return}try{localStorage.setItem(TOKEN_STORAGE_KEY,token);status.textContent='Token 已保存在当前浏览器本地。';status.className='token-note ok'}catch{status.textContent='保存失败：浏览器禁止本地存储。';status.className='token-note error'}};
$('removeToken').onclick=()=>{const status=$('tokenStatus');try{localStorage.removeItem(TOKEN_STORAGE_KEY);$('token').value='';status.textContent='已删除本地保存的 Token。';status.className='token-note ok'}catch{status.textContent='删除失败：浏览器禁止访问本地存储。';status.className='token-note error'}};
$('clearHistory').onclick=()=>{if(!history.length||!confirm('确定清空所有本地上传历史吗？'))return;history=[];persistHistory();renderHistory()};
$('testToken').onclick=async()=>{const status=$('tokenStatus');try{status.textContent='正在测试连接';status.className='token-note';const data=await request(API,{headers:headers()});if(!data.permissions?.push)status.textContent='连接成功，但 API 未确认写入权限；请确认 Contents 为 Read and write';else status.textContent=`连接成功，可以上传到 ${OWNER}/${REPO}`;status.className='token-note ok'}catch(error){status.textContent=`连接失败：${error.message}`;status.className='token-note error'}};
renderHistory();
</script>
</body>
